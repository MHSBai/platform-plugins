# Authoritative manifest for the MHSB platform plugin line.
#
# Every plugin, command, pack, connector requirement, release tier, trigger
# phrase and supported installation combination is declared here and nowhere
# else. tools/gen_manifest.py derives .claude-plugin/marketplace.json, the
# counts table and docs/catalog.md from this file; tools/lint.py checks the
# repository against it. Nothing is counted by hand.

schema_version: 1

marketplace:
  name: mhsb-platform-plugins
  description: >-
    Claude plugins for solo and small United States law firms on Lawmatics,
    Clio or MyCase, maintained by MHSB Solutions. Read-only in version 1.
  owner:
    name: MHSB Solutions
    url: https://mhsbsolutions.com

defaults:
  version: 0.2.0
  author:
    name: MHSB Solutions
    url: https://mhsbsolutions.com
  homepage: https://github.com/MHSBai/platform-plugins
  # connector_listing: privacy_policy_url and terms_of_service_url, emitted
  # into plugin.json of every connector plugin. Not set until both documents
  # are published; lint rule L16 requires them for a ga connector plugin.
  repository: https://github.com/MHSBai/platform-plugins
  plugin_root: plugins

licenses:
  apache: Apache-2.0
  source_available: LicenseRef-MHSB-Source-Available

# Remote MCP endpoints bundled by connector-carrying plugins. Fixed URLs, no
# user configuration, no local servers. A plugin that bundles a connector is
# listed (tier ga) only after tools/release_check.py passes for its URL; lint
# rule L16 enforces this under --release.
connectors:
  firm: https://mcp.mhsbsolutions.com/firm
  lawmatics: https://mcp.mhsbsolutions.com/lawmatics
  clio: https://mcp.mhsbsolutions.com/clio

# Release tiers: ga is listed in the marketplace; pilot is present in the
# repository and installed by MHSB for a named firm; hidden is present as a
# draft until an attorney in the practice co-designs it.
tiers: [ga, pilot, hidden]

# catalog_tier, optional on a practice pack: the tier Catalog v2.1 assigns when it
# differs from the release tier above. Only ga held at pilot is permitted: the pack
# ships unlisted, its fragment keeps release_tier ga, and its adoption record reads
# PENDING ADOPTION until an attorney adoption is recorded (Stage 11, decision 0004).

# Installation combinations. The generator enumerates every combination these
# rules produce and the lint checks each one.
combinations:
  - id: core-only
    description: Core alone, in paste mode, with no connector.
    include: [core]
  - id: connected
    description: >-
      Core plus operations plus exactly one platform plugin plus one to three
      practice packs.
    include: [core, operations]
    choose:
      - kind: platform
        min: 1
        max: 1
      - kind: practice
        min: 1
        max: 3

limits:
  max_commands_per_combination: 24
  design_commands_per_combination: 22

plugins:
  - name: mhsb-firm-core
    kind: core
    tier: ga
    license: apache
    category: governance
    mcp: null
    description: >-
      Free core plugin for law firm staff: orientation, a pre-paste
      confidentiality check, plain-language explanation, follow-up drafting,
      meeting notes, an AI policy draft for attorney adoption, role-based
      training and a support request. Operates without a connector.
    commands:
      - name: start
        register: operational
        connector: none
        promise: Five things to do by role and practice area; what changed in this release; which packs the Firm Profile enables.
        triggers:
          - what can you do for me
          - where do i begin
          - show me my commands
          - what changed in the plugin
          - where do i start
          - what can this do
      - name: before-i-paste
        register: operational
        connector: none
        promise: Category-based check before content is pasted; the check never sees the content first.
        triggers:
          - can i paste this
          - is it safe to paste
          - check before i paste
          - may i share this document with claude
          - can i paste
          - is it okay to put
      - name: explain-this
        register: operational
        connector: none
        promise: Plain-language explanation of a passage; no legal conclusions.
        triggers:
          - explain this in plain language
          - what does this mean
          - help me understand this document
          - what does this letter
          - explain this paragraph
      - name: follow-up
        register: operational
        connector: none
        promise: Next message in the firm's voice with the next step and its date; from the record when a connector is present, from pasted context otherwise; flags client threads older than two business days.
        triggers:
          - draft a follow-up
          - write back to the client
          - what should i send next
          - reply to this client email
          - write back to
          - what should i say to
          - waiting on a reply
      - name: meeting-notes
        register: operational
        connector: none
        promise: Matter note, tasks and a follow-up draft; a consent gate when the input is a transcript.
        triggers:
          - turn this call into notes
          - meeting notes
          - summarize this consultation
          - tasks from this meeting
          - file note
          - write it up
      - name: ai-policy-draft
        register: document
        connector: none
        promise: Decision sheet, counsel-reviewed template for the firm's state, and an adoption line.
        triggers:
          - draft our ai policy
          - we need an ai use policy
          - ai policy for the firm
          - rules for using ai
          - tell clients we use ai
      - name: ai-training
        register: operational
        connector: none
        promise: Role lessons on what to ask, what never to paste, how to verify and how to bill.
        triggers:
          - train my staff on ai
          - how should paralegals use claude
          - ai training for the team
          - how to use this safely
          - how do i bill time
      - name: ask-mhsb
        register: operational
        connector: none
        promise: Support request packaged for MHSB; matter content refused.
        triggers:
          - contact mhsb support
          - something is broken with the plugin
          - ask mhsb a question
          - who do i tell
          - note to mhsb

  - name: mhsb-operations
    kind: operations
    # Held at pilot until its connector passes tools/release_check.py (HANDOFF.md).
    tier: pilot
    license: source_available
    category: operations
    mcp: firm
    description: >-
      Read-only operations commands for subscribing firms: briefs, consultation
      preparation, matter status, intake triage, adopted letters, dates,
      document checklists, data hygiene, reports, register checks and setup
      verification. Bundles the MHSB firm connector.
    commands:
      - name: brief
        register: operational
        connector: firm
        promise: Views for today, week, stale, missing, caseload and leaks, plus pack views; every view carries the coverage statement and a data-gaps section.
        triggers:
          - what is due this week
          - anything stale
          - give me my morning brief
          - what is missing from my matters
          - caseload by staff
          - on my plate
          - nothing scheduled
          - most open cases
          - slipping through the cracks
      - name: consult-prep
        register: document
        connector: firm
        promise: One page from the record with known facts, missing information, fragment questions, a conflict reminder and the fee and disclosure conversations; also used for hearing preparation.
        triggers:
          - prepare me for the consultation
          - consult prep
          - get ready for the hearing
          - one page before the meeting with the prospect
          - get me ready for
          - what do i need to ask
          - what should i know
      - name: matter-status
        register: document
        connector: firm
        promise: Internal status from the full record; client-facing status from the client_visible allowlist through an adopted template with the approver named.
        triggers:
          - where does this matter stand
          - status of the matter
          - client update on the case
          - where are we on
          - case stands
      - name: intake-triage
        register: operational
        connector: firm
        promise: Scores leads against the fragment's structured criteria with sensitive fields excluded; records the conflict name-match; raises attorney-review flags rather than declines; proposes one action per lead.
        triggers:
          - triage new leads
          - which leads should we call first
          - score the intake queue
          - check new inquiries for conflicts
          - came in overnight
          - should we call first
          - conflict with anyone
      - name: letter
        register: document
        connector: firm
        promise: Renders an adopted template with variables from the record and the firm's periods; refuses an unadopted template; writes the approver into the draft.
        triggers:
          - draft a decline letter
          - welcome letter for the new client
          - document request letter
          - prepare a closing letter
          - say no to
          - papers we need
          - welcome packet
      - name: dates
        register: operational
        connector: firm
        promise: Dates from mapped fields only in the firm's time zone; the entered date governs; disagreements listed, never resolved; "date not established" with source and owner.
        triggers:
          - what deadlines are coming up
          - statute of limitations date
          - how many days since the accident
          - list the court dates
          - how many days since
          - does the statute run
          - court dates
      - name: checklist
        register: operational
        connector: firm
        promise: Documents present versus the fragment's document list per matter; readiness views driven by the fragment.
        triggers:
          - which documents are missing
          - is the file ready for signing
          - document checklist for this matter
          - still missing from
          - do we have the
          - file ready
      - name: hygiene
        register: operational
        connector: firm
        promise: Defined versus populated fields, duplicate and conflicting date fields, matters without practice area or responsible attorney, templates never used, retire lists.
        triggers:
          - audit our fields
          - clean up the platform data
          - duplicate date fields
          - matters without a responsible attorney
          - nobody use
          - two date fields
          - no attorney assigned
      - name: report
        register: document
        connector: firm
        promise: Lists the report catalog, runs one report now with the coverage statement, or prepares service delivery setup.
        triggers:
          - run the incident aging report
          - list available reports
          - schedule the monday report
          - set up a weekly report
          - monday numbers
          - run the
          - reports can i get
          - emailed to me
      - name: on-brand
        register: operational
        connector: firm
        promise: Checks a draft against the firm's voice, register and vocabulary; no tool or AI names in client copy except the adopted AI disclosure sentence.
        triggers:
          - is this on brand
          - check this draft against our voice
          - does this sound like the firm
          - sound like us
          - before it goes out
          - mention claude
      - name: check-setup
        register: operational
        connector: firm
        promise: Sign-in, plan attestation, enabled packs and role mode, profile version and hash, plugin and service versions, scheduled reports and their last run.
        triggers:
          - check my setup
          - am i signed in
          - which version am i running
          - is the connector working
          - why cannot i see
          - did the monday report
          - hooked up

  - name: mhsb-lawmatics
    kind: platform
    # Held at pilot until its connector passes tools/release_check.py (HANDOFF.md).
    tier: pilot
    license: source_available
    category: platform
    mcp: lawmatics
    description: >-
      Lawmatics platform commands: public form protection review and pipeline
      health. Bundles the MHSB Lawmatics connector. Read-only.
    commands:
      - name: form-protections
        register: operational
        connector: platform
        promise: Public forms without protection, confirmation triggers reachable by a fake booking, and unauthenticated submit exposure.
        triggers:
          - are our intake forms protected
          - public form exposure
          - can someone submit a fake booking
          - bot fill out
      - name: pipeline-health
        register: operational
        connector: platform
        promise: Stage definitions versus use, dark automations, templates never sent, duplicate sends.
        triggers:
          - pipeline health
          - which automations are dark
          - templates never sent
          - duplicate sends
          - actually going out

  - name: mhsb-clio
