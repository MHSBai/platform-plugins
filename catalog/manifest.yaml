    # Held at pilot until its connector passes tools/release_check.py (HANDOFF.md).
    tier: pilot
    license: source_available
    category: platform
    mcp: clio
    description: >-
      Clio platform commands: timekeeper hours, production by billing method
      and flat-fee budget versus actual. Bundles the MHSB Clio connector.
      Read-only.
    commands:
      - name: timekeeper-hours
        register: operational
        connector: platform
        promise: Hourly, flat-fee and total hours per timekeeper; team totals by default.
        triggers:
          - hours per timekeeper
          - how many hours did each attorney record
          - team hours this month
          - how many hours did
      - name: production
        register: operational
        connector: platform
        promise: Billed amounts by billing method.
        triggers:
          - production by billing method
          - billed amounts this month
          - how much did we bill
      - name: budget-vs-actual
        register: operational
        connector: platform
        promise: Budgeted hours versus recorded hours by matter.
        triggers:
          - budget versus actual
          - flat fee matters over budget
          - budgeted hours versus recorded
          - over budget

