# Practice-area pack fragment: bankruptcy, consumer (Catalog v2.1 Section 3.10). HIDDEN DRAFT.
# Not for use by any firm until an attorney in the practice co-designs it; see CO-DESIGN.md.
# Data only. Shape: the Stage 3 fragment schema (tools/schemas/fragment.schema.json).
# No legal conclusions. All Code and Rules periods are statutory, with citation placeholders.
# No engagement or welcome letter is generated until the statutory disclosure content is
# adopted into the template; the pack therefore lists no such template.
# Reports: the Catalog's document readiness rate has no identifier in the Stage 3 report
# registry, so it is not listed; see HANDOFF.md.
# Adoption: adoption.yaml (NOT ADOPTED). Tier hidden.
fragment_id: bankruptcy_consumer
practice_area: bankruptcy_consumer
version: 0.1.0
release_tier: hidden
adoption: {adopted_by: null, adopted_on: null, version: 0.1.0}
phi_default: true
intake_questions:
- {id: income_six_months, prompt: "Household income for each of the last six months", answer_type: text, required: true, sensitive_tag: financial}
- {id: household_size, prompt: "Household size", answer_type: number, required: true, sensitive_tag: null}
- {id: debts_by_type, prompt: "Debts by type", answer_type: text, required: true, sensitive_tag: financial}
- {id: assets, prompt: "Assets", answer_type: text, required: true, sensitive_tag: financial}
- {id: prior_filings, prompt: "Any prior bankruptcy filing, with the date", answer_type: text, required: true, sensitive_tag: null}
- {id: suits_garnishments_foreclosure, prompt: "Pending suits, garnishments or foreclosure", answer_type: text, required: false, sensitive_tag: null}
- {id: transfers, prompt: "Transfers of property or payments to family members", answer_type: text, required: false, sensitive_tag: financial}
- {id: business_ownership, prompt: "Any business owned now or recently", answer_type: boolean, required: true, sensitive_tag: null}
attorney_review_flags:
- prior_filing_question
- conflict_match
- outside_jurisdiction
document_list:
- {id: pay_stubs, name: "Pay stubs", required: true}
- {id: latest_tax_return, name: "Latest tax return", required: true}
- {id: statements, name: "Bank and account statements", required: true}
- {id: identification, name: "Identification", required: true}
- {id: counseling_certificate, name: "Credit counseling certificate", required: true}
stage_map:
- {fragment_stage: New Lead, canonical: stage_intake_01_new_lead}
- {fragment_stage: Eligibility Screen, canonical: stage_intake_02_contact_attempted}
- {fragment_stage: Docs Requested, canonical: stage_intake_02_contact_attempted}
- {fragment_stage: Consultation, canonical: stage_intake_04_consult_completed}
- {fragment_stage: Retainer Sent, canonical: stage_intake_05_retainer_sent}
- {fragment_stage: Hired, canonical: stage_intake_06_retained}
- {fragment_stage: Petition, canonical: stage_matter_10_open}
- {fragment_stage: 341 meeting, canonical: stage_matter_20_active}
- {fragment_stage: Debtor education, canonical: stage_matter_20_active}
- {fragment_stage: Discharge, canonical: stage_matter_40_closing}
fee_model:
  types: [flat]
  notes: "Flat fee for Chapter 7; Chapter 13 fees are court-reviewed."
deadline_categories:
- id: code_rules_period
  name: "Code and Rules periods"
  kind: statutory
  entered_date_governs: true
  citation: "CITATION PENDING: Bankruptcy Code and Rules provisions for each period, to be confirmed and recorded by the co-designing attorney"
  adopter: {adopted_by: null, adopted_on: null, version: 0.1.0}
- id: debtor_education_deadline
  name: "Debtor education course deadline"
  kind: statutory
  entered_date_governs: true
  citation: "CITATION PENDING: debtor education provisions, to be confirmed and recorded by the co-designing attorney"
  adopter: {adopted_by: null, adopted_on: null, version: 0.1.0}
- id: meeting_of_creditors_date
  name: "Meeting of creditors date, entered from the court's notice"
  kind: firm_set
  entered_date_governs: true
  citation: null
  adopter: null
communication_templates:
- bk_document_checklist
- bk_meeting_341_prep
- bk_course_deadlines
- bk_discharge_notice
consent_flags: []
sensitive_field_tags:
- {field: intake.income_six_months, tag: financial, excluded_from_scoring: true, masked_in_reports: true}
- {field: intake.debts_by_type, tag: financial, excluded_from_scoring: true, masked_in_reports: true}
- {field: intake.assets, tag: financial, excluded_from_scoring: true, masked_in_reports: true}
- {field: intake.transfers, tag: financial, excluded_from_scoring: true, masked_in_reports: true}
brief_views:
- {id: meeting_341_readiness, name: "341 readiness"}
- {id: document_readiness, name: "Document readiness"}
reports: []
