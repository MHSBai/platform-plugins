# Practice-area pack fragment: landlord-tenant and consumer (Catalog v2.1 Section 3.12).
# HIDDEN DRAFT. Not for use by any firm until an attorney in the practice co-designs it;
# see CO-DESIGN.md.
# Data only. Shape: the Stage 3 fragment schema (tools/schemas/fragment.schema.json).
# No legal conclusions. Eviction answer windows and consumer suit and dispute windows are
# statutory by state and never firm-set; each carries a citation placeholder. Flags are
# attorney-review flags and never decline. Sensitive fields are excluded from scoring.
# Adoption: adoption.yaml (NOT ADOPTED). Tier hidden.
fragment_id: landlord_tenant_consumer
practice_area: landlord_tenant_consumer
version: 0.1.0
release_tier: hidden
adoption: {adopted_by: null, adopted_on: null, version: 0.1.0}
phi_default: true
intake_questions:
- {id: side, prompt: "Which side the person is on", answer_type: choice, choices: [tenant, landlord, consumer, other], required: true, sensitive_tag: null}
- {id: property, prompt: "Property address", answer_type: address, required: false, sensitive_tag: null}
- {id: lease, prompt: "Whether a written lease exists", answer_type: choice, choices: ["yes", "no", unknown], required: false, sensitive_tag: null}
- {id: notices_dates, prompt: "Notices received or served, each with its date", answer_type: text, required: false, sensitive_tag: null}
- {id: rent_ledger, prompt: "Rent ledger or amounts claimed", answer_type: text, required: false, sensitive_tag: financial}
- {id: answer_hearing_date, prompt: "Answer or hearing date, as written on the court papers", answer_type: date, required: false, sensitive_tag: null}
- {id: habitability, prompt: "Habitability conditions, in the person's words", answer_type: text, required: false, sensitive_tag: null}
- {id: subsidy_status, prompt: "Whether the tenancy is subsidized", answer_type: choice, choices: ["yes", "no", unknown], required: false, sensitive_tag: financial}
- {id: collector, prompt: "Collector or creditor named", answer_type: text, required: false, sensitive_tag: null}
- {id: debt, prompt: "Debt claimed", answer_type: currency, required: false, sensitive_tag: financial}
- {id: debt_dates, prompt: "Dates of the debt and of collection contacts", answer_type: text, required: false, sensitive_tag: null}
- {id: validation_notice, prompt: "Whether a validation notice was received, and its date", answer_type: text, required: false, sensitive_tag: null}
attorney_review_flags:
- answer_deadline_question
- conflict_match
- fee_shifting_question
document_list:
- {id: lease, name: "Lease", required: false}
- {id: notices, name: "Notices", required: true}
- {id: ledger, name: "Rent ledger", required: false}
- {id: texts_photos, name: "Texts and photographs", required: false}
- {id: court_papers, name: "Court papers", required: true}
- {id: collection_letters, name: "Collection letters", required: false}
- {id: call_logs_voicemails, name: "Call logs and voicemails", required: false}
- {id: credit_reports, name: "Credit reports", required: false}
stage_map:
- {fragment_stage: Urgent inquiry, canonical: stage_intake_01_new_lead}
- {fragment_stage: Same-day screen, canonical: stage_intake_04_consult_completed}
- {fragment_stage: Limited-scope or flat-fee agreement, canonical: stage_intake_05_retainer_sent}
- {fragment_stage: Answer or filing, canonical: stage_matter_10_open}
- {fragment_stage: Hearing or mediation, canonical: stage_matter_20_active}
- {fragment_stage: Judgment or stipulation, canonical: stage_matter_30_resolution}
- {fragment_stage: Close, canonical: stage_matter_40_closing}
