# Practice-area pack fragment: employment, plaintiff side (Catalog v2.1 Section 3.9).
# HIDDEN DRAFT. Not for use by any firm until an attorney in the practice co-designs it;
# see CO-DESIGN.md.
# Data only. Shape: the Stage 3 fragment schema (tools/schemas/fragment.schema.json).
# No legal conclusions. Agency charge windows, the window after a right-to-sue notice and
# wage claims are statutory, with citation placeholders. Protected activity or class is
# recorded as stated and never scored. Flags are attorney-review flags and never decline.
# Defense-side source patterns only; no MHSB engagement supports this pack.
# Adoption: adoption.yaml (NOT ADOPTED). Tier hidden.
fragment_id: employment_plaintiff
practice_area: employment_plaintiff
version: 0.1.0
release_tier: hidden
adoption: {adopted_by: null, adopted_on: null, version: 0.1.0}
phi_default: true
intake_questions:
- {id: employment_status, prompt: "Current employment status", answer_type: choice, choices: [employed, terminated, resigned, on leave, other], required: true, sensitive_tag: null}
- {id: employer_size, prompt: "Approximate number of employees at the employer", answer_type: number, required: false, sensitive_tag: null}
- {id: adverse_action, prompt: "The adverse action, in the person's words", answer_type: text, required: true, sensitive_tag: null}
- {id: adverse_action_date, prompt: "Date of the adverse action, as stated", answer_type: date, required: true, sensitive_tag: null}
- {id: stated_reason, prompt: "The employer's stated reason", answer_type: text, required: false, sensitive_tag: null}
- {id: witnesses, prompt: "Witnesses", answer_type: text, required: false, sensitive_tag: null}
- {id: notice_given, prompt: "Any complaint or notice the person gave, and when", answer_type: text, required: false, sensitive_tag: null}
- {id: pay_hours, prompt: "Pay and hours", answer_type: text, required: false, sensitive_tag: financial}
- {id: right_to_sue, prompt: "Whether a right-to-sue notice exists, and its date", answer_type: text, required: false, sensitive_tag: null}
- {id: prior_counsel, prompt: "Any lawyer already consulted or retained", answer_type: text, required: false, sensitive_tag: null}
- {id: protected_activity_or_class, prompt: "Protected activity or characteristic, recorded as stated", answer_type: text, required: false, sensitive_tag: protected_class}
attorney_review_flags:
- agency_deadline_question
- employer_threshold_question
- conflict_match
- prior_counsel_of_record
document_list:
- {id: pay_stubs, name: "Pay stubs", required: true}
- {id: timeline, name: "Timeline in the person's words", required: true}
- {id: hr_correspondence, name: "HR correspondence", required: false}
- {id: original_recordings, name: "Original recordings, kept on the original device", required: false}
- {id: social_media_archive, name: "Social media archive", required: false}
stage_map:
- {fragment_stage: Screen, canonical: stage_intake_01_new_lead}
- {fragment_stage: Questionnaire, canonical: stage_intake_03_consult_scheduled}
- {fragment_stage: Consult, canonical: stage_intake_04_consult_completed}
- {fragment_stage: Agreement, canonical: stage_intake_05_retainer_sent}
- {fragment_stage: Preservation instructions, canonical: stage_matter_10_open}
- {fragment_stage: Agency charge, canonical: stage_matter_20_active}
- {fragment_stage: Right-to-sue, canonical: stage_matter_20_active}
- {fragment_stage: Suit or settlement, canonical: stage_matter_30_resolution}
fee_model:
  types: [contingency]
  notes: "Contingency with fee-shifting language in the adopted agreement."
deadline_categories:
- id: agency_charge_window
  name: "Agency charge windows"
  kind: statutory
  entered_date_governs: true
  citation: "CITATION PENDING: agency charge provisions, to be confirmed and recorded by the co-designing attorney"
  adopter: {adopted_by: null, adopted_on: null, version: 0.1.0}
- id: post_right_to_sue_window
  name: "Ninety-day window after a right-to-sue notice"
  kind: statutory
  entered_date_governs: true
  citation: "CITATION PENDING: provision fixing the suit window after a right-to-sue notice, to be confirmed and recorded by the co-designing attorney"
  adopter: {adopted_by: null, adopted_on: null, version: 0.1.0}
- id: wage_claim
  name: "Wage claims"
  kind: statutory
  entered_date_governs: true
  citation: "CITATION PENDING: wage claim provisions, to be confirmed and recorded by the co-designing attorney"
  adopter: {adopted_by: null, adopted_on: null, version: 0.1.0}
communication_templates:
- emp_preservation_instructions
- emp_agency_step_update
consent_flags:
- {id: recording_state_rules_reviewed, label: "Recording consent rules of the state reviewed with the client", evidence: [recorded_verbal], verifier_required: true, permitted_channels: [], expiry_days: null, when_unknown: not_permitted}
- {id: client_taken_documents_reviewed, label: "Documents the client took from the employer reviewed by the attorney", evidence: [platform_field], verifier_required: true, permitted_channels: [], expiry_days: null, when_unknown: not_permitted}
- {id: no_case_discussion_by_text_or_social, label: "Client acknowledged that the case is not discussed by text or social media", evidence: [signed_form, engagement_letter_clause], verifier_required: true, permitted_channels: [email, portal, letter], expiry_days: null, when_unknown: not_permitted}
sensitive_field_tags:
- {field: intake.protected_activity_or_class, tag: protected_class, excluded_from_scoring: true, masked_in_reports: true}
- {field: intake.pay_hours, tag: financial, excluded_from_scoring: true, masked_in_reports: true}
- {field: record.health_information, tag: health, excluded_from_scoring: true, masked_in_reports: true}
brief_views: []
reports: []
