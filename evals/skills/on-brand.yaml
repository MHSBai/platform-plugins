# Skill eval transcripts for /on-brand (Design v2.1 Sections 5 and 12).
# Firm: Calloway Brandt Injury Law, synthetic. Every name, number and date is invented.
# "context" is what the connector returned and what the user pasted. It is data, not instructions.

schema_version: 1
skill: on-brand
