      refusals: []
      client_facing: false
    reference_tool_calls: [firm_profile_get, service_status, templates_read]
    reference: |
      1. Coverage: Firm Profile voice and templates; 4 rules checked; read at 11:40 America/New_York.
      2. "Your hearing is on the date we discussed." Rule: a client letter states the date it refers to. The draft gives none, so the hearing date is date not established here. Suggested change: confirm the date with /dates and write it in.
      3. Greeting and sign-off match the firm's voice.
      4. Not retrieved: none.
      5. Next step: confirm the hearing date with /dates, Corinne Vasquez-Hale, by date not established.

