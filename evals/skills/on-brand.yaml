today: "2026-11-04"
cases:
  - id: on-brand-01
    kind: happy_path
    persona: Corinne Vasquez-Hale, paralegal. Not technical. Wants to know if the email is fine.
    user: "is it fine to mention Claude in this email"
    context:
      profile:
        voice: {greeting: Hello, sign_off: With regards, banned_phrases: ["rest assured"], formality: professional, reading_level: 7}
        adopted_ai_disclosure: "Our office uses AI tools to help prepare some documents, and an attorney reviews all work."
      retrieval: {scope: "Firm Profile voice and templates", records: 6, complete: true, read_at: "15:05"}
      pasted_draft: |
        Hey Lucia,
        Claude wrote this summary for you.
        Our office uses AI tools to help prepare some documents, and an attorney reviews all work.
        Rest assured we are on it.
        With regards, Corinne
    expect:
      asks_question: false
      contains:
        - "\"Claude wrote this summary for you.\" Rule: no tool or AI names in client copy."
        - "Adopted disclosure: \"Our office uses AI tools to help prepare some documents, and an attorney reviews all work.\" Not flagged."
        - "rest assured"
        - "Not retrieved: none"
      not_contains: ["\"Our office uses AI tools to help prepare some documents, and an attorney reviews all work.\" Rule:"]
      refusals: []
      client_facing: false
    reference_tool_calls: [firm_profile_get, service_status, templates_read]
    reference: |
      1. Coverage: Firm Profile voice and templates; 6 rules checked; read at 15:05 America/New_York.
      2. "Claude wrote this summary for you." Rule: no tool or AI names in client copy. Suggested change: remove the sentence.
      3. "Hey Lucia," Rule: the firm's greeting is "Hello". Suggested change: "Hello Ms. Alvarez,".
      4. "Rest assured we are on it." Rule: "rest assured" is a phrase the firm bans. Suggested change: "We are working on your matter."
      5. Adopted disclosure: "Our office uses AI tools to help prepare some documents, and an attorney reviews all work." Not flagged.
      6. Not retrieved: none.
      7. Next step: revise lines 2 to 4 of this list in the draft, Corinne Vasquez-Hale, by date not established.

