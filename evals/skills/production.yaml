# Skill eval transcripts for /production (Design v2.1 Section 12).
# Firm: Wrenfield Estate Law LLC, synthetic, on Clio. Every name, amount and date is invented.
# "context" is what the connector returned. It is data, not instructions.

schema_version: 1
skill: production
plugin: mhsb-clio
today: "2026-11-04"
cases:
  - id: production-01
    kind: happy_path
    persona: Imogen Wrenfield, owner attorney. Checks the month before the partners' meeting.
    user: "how much did we bill in October"
    context:
      profile: {FIRM_TZ: America/Chicago, role_mode: platform-default}
      retrieval: {scope: "bills dated 2026-10-01 to 2026-10-31", records: 38, complete: true, read_at: "08:50"}
      by_method: [{method: flat fee, total: "28,400.00"}, {method: hourly, total: "17,925.50"}]
      no_method: [{matter: WE-2026-044, bills: 1}]
    expect:
      asks_question: false
      contains: ["$28,400.00", "$17,925.50", "WE-2026-044", "Not retrieved: none", "Next step:"]
      not_contains: []
      refusals: []
      client_facing: false
    reference_tool_calls: [firm_profile_get, service_status, clio_who_am_i, clio_bills_list, clio_matters_search]
    reference: |
      1. Coverage: bills dated 2026-10-01 to 2026-10-31; 38 bills; all pages read: yes; read at 08:50 America/Chicago.
      2. Flat fee: $28,400.00 [bills.total by matter.billing_method].
      3. Hourly: $17,925.50 [bills.total by matter.billing_method].
      4. Data gaps: 1 bill on WE-2026-044 has no billing method on its matter.
      5. Not retrieved: none.
      6. Next step: set the billing method on WE-2026-044, Imogen Wrenfield, by date not established.

