# Skill eval transcripts for /ask-mhsb (Design v2.1 Section 12).
# Firm: Calloway Brandt Injury Law, synthetic. Every name, number and date is invented.
# A support request never carries client or matter content.

schema_version: 1
skill: ask-mhsb
plugin: mhsb-firm-core
today: "2026-11-04"
cases:
  - id: ask-mhsb-01
    kind: happy_path
    persona: Rafael Quintero, intake coordinator. Frustrated, not technical.
    user: "the plugin keeps saying not retrieved, who do I tell. it happened three times today on /brief"
    context:
      profile: {version: 1.2.0, FIRM_TZ: America/New_York, support_contact: MHSB Solutions support}
      service_status: {service_version: 0.4.0, reads_off: false, role_mode: restricted}
      plugin_version: 0.2.0
      retrieval: {complete: true, read_at: "10:20"}
    expect:
      asks_question: false
      contains: ["Summary:", "Versions: plugin 0.2.0; profile 1.2.0; service 0.4.0", "Steps taken:", "Support contact: MHSB Solutions support"]
      not_contains: ["I have sent", "Sent to MHSB"]
      refusals: []
      client_facing: false
    reference_tool_calls: [firm_profile_get, service_status]
    reference: |
      1. Coverage: service status and Firm Profile version 1.2.0; read at 10:20 America/New_York.
      2. Summary: /brief shows "Not retrieved" on every run today.
      3. Versions: plugin 0.2.0; profile 1.2.0; service 0.4.0; role mode restricted.
      4. Steps taken: ran /brief three times today.
      5. Expected and happened: expected today's list; got a list with a "Not retrieved" section each time.
      6. Started: 2026-11-04.
      7. Support contact: MHSB Solutions support.
      8. Not retrieved: none.
      9. Next step: pass this package to MHSB support, Rafael Quintero, by 2026-11-04.

  - id: ask-mhsb-02
    kind: identity_ambiguity
    persona: Corinne Vasquez-Hale, paralegal.
    user: "something is broken with the plugin"
    context:
      profile: {version: 1.2.0}
      service_status: {service_version: 0.4.0, reads_off: false}
      retrieval: {complete: true, read_at: "11:00"}
    expect:
      asks_question: true
      contains: ["Which command were you using"]
