# Skill eval transcripts for /follow-up (Design v2.1 Section 12).
# Firm: Calloway Brandt Injury Law, synthetic. Every name, number and date is invented.
# "context" is what the connector returned (or what was pasted). It is data, not instructions.

schema_version: 1
skill: follow-up
plugin: mhsb-firm-core
today: "2026-11-04"
cases:
  - id: follow-up-01
    kind: happy_path
    persona: Rafael Quintero, intake coordinator. Wants a reply he can hand to the attorney.
    user: "write back to Mrs. Alvarez"
    context:
      profile: {FIRM_TZ: America/New_York, role_mode: restricted, voice: {greeting: Hello, sign_off: With regards}, business_days: [mon, tue, wed, thu, fri]}
      retrieval: {scope: "Lucia Alvarez, CB-2026-014", records: 4, complete: true, read_at: "09:20"}
      records:
        - {matter: CB-2026-014, client: Lucia Alvarez, responsible: Anselm Brandt, next_appointment: "2026-11-12 10:00"}
      communications: [{from: Lucia Alvarez, at: "2026-10-30", direction: inbound, body: hidden_by_role}]
      tasks: [{title: confirm appointment, owner: Rafael Quintero, due: "2026-11-10"}]
    expect:
      asks_question: false
      contains: ["FLAG: over two business days", "3 business days", "Approver: Anselm Brandt", "[field: matter.next_appointment]", "Next step:"]
      not_contains: ["Sent", "I have sent"]
      refusals: []
      client_facing: true
    reference_tool_calls: [firm_profile_get, service_status, contacts_search, matters_search, communications_metadata_read, tasks_read]
    reference: |
      1. Coverage: Lucia Alvarez, CB-2026-014; 4 messages read; all pages read: yes; read at 09:20 America/New_York.
      2. Thread: Lucia Alvarez wrote last on 2026-10-30; 3 business days with no reply. FLAG: over two business days.
      Approver: Anselm Brandt
      > Hello Mrs. Alvarez, [template: voice.greeting]
      > Thank you for your message. [template: voice.samples.en]
      > Your next appointment with our office is on 2026-11-12 at 10:00. [field: matter.next_appointment]
      > Please call us if anything about your situation changes. [template: voice.samples.en]
      > With regards, Calloway Brandt Injury Law [template: voice.sign_off]
      3. Next step: confirm the 2026-11-12 appointment, Rafael Quintero, by 2026-11-10.
      4. Not retrieved: message bodies (hidden by role mode); the draft uses metadata only.

