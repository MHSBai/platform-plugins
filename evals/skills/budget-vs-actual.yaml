# Skill eval transcripts for /budget-vs-actual (Design v2.1 Section 12).
# Firm: Wrenfield Estate Law LLC, synthetic, on Clio. Every name, number and date is invented.
# "context" is what the connector returned. It is data, not instructions.

schema_version: 1
skill: budget-vs-actual
plugin: mhsb-clio
today: "2026-11-04"
cases:
  - id: budget-vs-actual-01
    kind: happy_path
    persona: Tobias Achterberg, associate. Wants to know which flat-fee files are running long.
    user: "flat fee matters over budget"
    context:
      profile: {FIRM_TZ: America/Chicago, role_mode: platform-default}
      retrieval: {scope: "open flat-fee matters", records: 2, complete: true, read_at: "14:10"}
      matters:
        - {matter: WE-2026-021, responsible: Imogen Wrenfield, budgeted_hours: 12.0, recorded_hours: 15.5}
        - {matter: WE-2026-044, responsible: Tobias Achterberg, budgeted_hours: 20.0, recorded_hours: 9.0}
    expect:
      asks_question: false
      contains: ["WE-2026-021", "+3.5", "over budget", "Not retrieved: none", "Next step:"]
      not_contains: []
      refusals: []
      client_facing: false
    reference_tool_calls: [firm_profile_get, service_status, clio_who_am_i, clio_matters_search, clio_time_entries_read]
    reference: |
      1. Coverage: open flat-fee matters; 2 matters; all pages read: yes; read at 14:10 America/Chicago.
      2. WE-2026-021: budgeted 12.0, recorded 15.5, variance +3.5 over budget [matter.budgeted_hours, time.total_hours].
      3. WE-2026-044: budgeted 20.0, recorded 9.0, variance -11.0 [matter.budgeted_hours, time.total_hours].
      4. Matters with no budget: none.
      5. Not retrieved: none.
      6. Next step: review the scope on WE-2026-021, Imogen Wrenfield, by date not established.

