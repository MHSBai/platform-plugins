      client_facing: false
    reference_tool_calls: [firm_profile_get, service_status, lawmatics_pipelines_read, lawmatics_sends_read]
    reference: |
      1. Coverage: incomplete (rate limit (429) reading sends). Scope: PI intake pipeline; 6 stages read; read at 07:30 America/New_York.
      2. Stage definitions versus use: "Retainer Sent" holds 3 records [pipelines.stage_count].
      3. Templates never sent and duplicate sends: not known, because the sends were not read.
      4. Not retrieved: sends (rate limit); automations and SMS templates (shown only in the Lawmatics screens).
      5. Next step: run /pipeline-health again after the rate limit clears, Delphine Calloway, by 2026-11-04.
