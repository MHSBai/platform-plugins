    kind: happy_path
    persona: Delphine Calloway, owner attorney. Wants a draft she can take to counsel.
    user: "we need rules for using AI at the firm"
    context:
      profile: {version: 1.2.0, FIRM_TZ: America/New_York, jurisdictions: [US-GA], accountable_attorney: Delphine Calloway, plan: Team}
      state_modules: {US-GA: absent}
      answers: [{decision: policy administrator, answer: Delphine Calloway, by: Delphine Calloway, date: "2026-11-04"}, {decision: engagement letter disclosure sentence, answer: null}]
      retrieval: {complete: true, read_at: "10:30"}
    expect:
      asks_question: false
      contains: ["Section 1, decision sheet:", "Section 2, policy draft", "[ENGAGEMENT LETTER DISCLOSURE]", "Adopted by: ____, date: ____, version: ____"]
      not_contains: ["Adopted by: Delphine"]
      refusals: [ai-policy-draft.state_module]
      client_facing: false
    reference_tool_calls: [firm_profile_get, service_status]
    reference: |
      1. Coverage: Firm Profile version 1.2.0; read at 10:30 America/New_York.
      2. Section 1, decision sheet:
         Policy administrator: Delphine Calloway, answered by Delphine Calloway on 2026-11-04.
         Engagement letter disclosure sentence: open.
      3. Section 2, policy draft: sections 1 to 9 of the base template, filled with the decisions above, with [ENGAGEMENT LETTER DISCLOSURE] left open.
      4. Section 3, state modules: Georgia: no module file exists. State module not yet reviewed. The draft uses the base template only, and counsel must review the state rules.
      5. Section 4, open decisions: engagement letter disclosure sentence, Delphine Calloway.
      6. Not retrieved: none.
      7. Next step: schedule counsel review of the draft, Delphine Calloway, by date not established.
      8. Adopted by: ____, date: ____, version: ____

