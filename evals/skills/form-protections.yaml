      asks_question: false
      contains: ["Coverage: all public forms", "Free Case Review", "Click path:", "Not retrieved: none", "Next step:"]
      not_contains: ["Client Portal Upload has no"]
      refusals: []
      client_facing: false
    reference_tool_calls: [firm_profile_get, service_status, lawmatics_who_am_i, lawmatics_forms_read, lawmatics_automations_read]
    reference: |
      1. Coverage: all public forms; 3 forms; all pages read: yes; read at 10:15 America/New_York.
      2. Forms without protection: "Free Case Review" has no bot check [forms.captcha_enabled: false].
      3. Confirmation triggers reachable by a fake booking: "Free Case Review" starts the consultation confirmation email on submit [automations.trigger].
      4. Submit paths open without sign-in: "Free Case Review" and "Contact Us" public links [forms.sign_in_required: false].
      5. Recommended changes: turn on the bot check for "Free Case Review". Click path: Forms, Free Case Review, Settings, Spam protection.
      6. Not retrieved: none.
      7. Next step: turn on spam protection for "Free Case Review", Delphine Calloway, by date not established.

