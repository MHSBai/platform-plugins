name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Generated files current
        run: python tools/gen_manifest.py --check
      - name: Lint
        run: python tools/lint.py
      - name: Pack evals
        run: python tools/pack_evals.py
      - name: Routing suite (deterministic)
        run: python tools/routing_check.py
      - name: Skill evals (deterministic)
        run: python tools/skill_evals.py
      - name: License gate (LEDGER.yaml, PROVENANCE.md, plugin license copies, upstream hashes)
        run: python tools/license_gate.py --upstream

  release-gate:
    # PP1-N2: no signed tag exists, so main is the only installable ref. The
    # release gate therefore runs on every pull request, every push to main and
    # every v* tag, not on tags alone: a promotion to ga cannot reach main
    # without lint rule L16 (tools/release_check.py against the connector and
    # the listing URLs), the adoption records of rule L11 and the model eval
    # gate (a record on the current text in which every ga plugin passes).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Release lint (L11 adoption, L16 connector release check and listing URLs)
        run: python tools/lint.py --release
      - name: Model eval release gate (Design v2.1 Section 12; every ga plugin passes its evals)
        run: python tools/model_evals.py --check-release

  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  agent-scan:
    # Design v2.1 Section 8: snyk/agent-scan on the public repository's CI.
    # PP1-N3: the job has no job-level condition, so it always runs, and it
    # concludes success only when the scan ran and passed. When no scan runs
    # (a fork pull request, which GitHub gives no secrets, or SNYK_TOKEN not
    # set) the last step fails with the reason. A required agent-scan can
    # therefore never pass by skipping.
    runs-on: ubuntu-24.04
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - id: token
        name: Token presence
        run: |
          if [ -n "$SNYK_TOKEN" ]; then
            echo "SNYK_TOKEN: SET"; echo "present=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "SNYK_TOKEN: EMPTY"; echo "present=false" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        if: steps.token.outputs.present == 'true'
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        if: steps.token.outputs.present == 'true'
      - id: scan
        name: Scan skills
        if: steps.token.outputs.present == 'true'
        run: |
          set -euo pipefail
          dirs=(plugins/*/skills)
          uvx snyk-agent-scan@0.5.17 scan --ci --skills "${dirs[@]}"
      - name: Require a completed scan
        if: always()
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ "$SCAN_OUTCOME" = "success" ]; then
            echo "agent-scan: the skills were scanned"; exit 0
          fi
          if [ "$SCAN_OUTCOME" != "skipped" ]; then
            echo "::error title=agent-scan::The scan step concluded $SCAN_OUTCOME."; exit 1
          fi
          if [ "$FORK" = "true" ]; then
            reason="this pull request comes from a fork, and GitHub passes no secrets to a workflow triggered from a fork. A maintainer pushes the branch to this repository to scan it"
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            reason="SNYK_TOKEN is not set, so $GITHUB_REF was not scanned (HANDOFF item 2)"
          else
            reason="SNYK_TOKEN is not set (HANDOFF item 2)"
          fi
          echo "::error title=agent-scan did not run::No scan ran: $reason."
          exit 1
