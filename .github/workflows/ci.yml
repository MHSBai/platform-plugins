name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Generated files current
        run: python tools/gen_manifest.py --check
      - name: Lint
        run: python tools/lint.py
      - name: Pack evals
        run: python tools/pack_evals.py
      - name: Routing suite (deterministic)
        run: python tools/routing_check.py
      - name: Skill evals (deterministic)
        run: python tools/skill_evals.py
      - name: License gate (LEDGER.yaml and PROVENANCE.md)
        run: python tools/license_gate.py
      - name: Release gate (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: python tools/lint.py --release

  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  agent-scan:
    # Design v2.1 Section 8: snyk/agent-scan runs only on the public repository's CI.
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
      - name: Token presence
        run: |
          if [ -n "$SNYK_TOKEN" ]; then echo "SNYK_TOKEN: SET"; else echo "SNYK_TOKEN: EMPTY; scan skipped"; fi
      - name: Scan skills
        if: env.SNYK_TOKEN != ''
        run: |
          set -euo pipefail
          dirs=$(ls -d plugins/*/skills)
          uvx snyk-agent-scan@0.5.17 scan --ci --skills $dirs
