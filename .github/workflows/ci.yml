name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Generated files current
        run: python tools/gen_manifest.py --check
      - name: Lint
        run: python tools/lint.py
      - name: Pack evals
        run: python tools/pack_evals.py
      - name: Routing suite (deterministic)
        run: python tools/routing_check.py
      - name: Skill evals (deterministic)
        run: python tools/skill_evals.py
      - name: License gate (LEDGER.yaml, PROVENANCE.md, plugin license copies, upstream hashes)
        run: python tools/license_gate.py --upstream
      - name: Release gate (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: python tools/lint.py --release
      - name: Model eval release gate (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: python tools/model_evals.py --check-release

  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  agent-scan-token:
    # Reports whether SNYK_TOKEN is set, never its value. Job-level conditions
    # cannot read secrets, so agent-scan reads this job's output instead.
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    outputs:
      present: ${{ steps.token.outputs.present }}
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - id: token
        name: Token presence
        run: |
          if [ -n "$SNYK_TOKEN" ]; then
            echo "SNYK_TOKEN: SET"; echo "present=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "SNYK_TOKEN: EMPTY"; echo "present=false" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" != "push" ]; then
            echo "::notice title=agent-scan skipped::SNYK_TOKEN is not set, so agent-scan is skipped on this pull request and reports no scan result (HANDOFF item 2)."
          fi

  agent-scan:
    # Design v2.1 Section 8: snyk/agent-scan runs only on the public repository's CI.
    # Pull request without the token: the job is skipped (reason in agent-scan-token).
    # Push to main or a v* tag without the token: the job runs and fails.
    # Whenever the job runs to success, the scan ran.
    needs: agent-scan-token
    if: github.event.repository.private == false && (github.event_name == 'push' || needs.agent-scan-token.outputs.present == 'true')
    runs-on: ubuntu-24.04
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Require SNYK_TOKEN
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "::error title=agent-scan::SNYK_TOKEN is not set, so the skills cannot be scanned on $GITHUB_REF. agent-scan fails on every push to main and every v* tag until the secret is set (HANDOFF item 2)."
            exit 1
          fi
          echo "SNYK_TOKEN: SET"
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
      - name: Scan skills
        run: |
          set -euo pipefail
          dirs=(plugins/*/skills)
          uvx snyk-agent-scan@0.5.17 scan --ci --skills "${dirs[@]}"
